name: Refresh data and deploy

on:
  schedule:
    - cron: "0 22 * * *" # 03:30 IST — fresh data for the 05:00 phone alert
    - cron: "30 */3 * * *" # every 3 hours (half past, away from the busiest minute)
  workflow_dispatch:
    inputs:
      full:
        description: "Rebuild every data product from scratch"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Restore data cache
        uses: actions/cache/restore@v6
        with:
          path: pipeline/cache
          key: surf-data-${{ github.run_id }}
          restore-keys: surf-data-

      - name: Install pipeline dependencies
        run: pip install -r requirements.txt

      - name: Build data products (only what is stale)
        env:
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
        run: python -m pipeline.build ${{ inputs.full && '--full' || '' }}

      - name: Save data cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: pipeline/cache
          key: surf-data-${{ github.run_id }}

      - name: Pipeline tests
        run: python -m pytest pipeline/tests -q

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Web tests
        working-directory: web
        run: npm test

      - name: Build phone API (alert.json, now.json, forecast.json, cyclones.json)
        working-directory: web
        run: npm run build:api

      - name: Build site
        working-directory: web
        run: npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  heartbeat:
    # GitHub switches off schedules in repos with no commits for 60 days.
    # A one-line commit on the 1st of each month keeps them running.
    if: github.event_name == 'schedule' && github.event.schedule == '0 22 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Monthly heartbeat commit
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            date -u +%FT%TZ > .github/heartbeat
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/heartbeat
            git commit -m "chore: monthly heartbeat (keeps the schedule alive)"
            git push
          fi
